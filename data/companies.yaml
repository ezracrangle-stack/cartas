# Companies the site tracks in the letters.
# name: how it shows on the site. aliases: other ways letters write it.
# Left out on purpose: names letters use as data sources or contact links (FactSet, Bloomberg, Twitter, LinkedIn) or meeting tools (Zoom).
# sector: one of the 11 GICS sectors (Information Technology, Health Care, Consumer Staples,
#   Consumer Discretionary, Financials, Industrials, Energy, Materials, Utilities, Real Estate,
#   Communication Services).
# exclude: a regex; a name that matches it doesn't count (e.g. "Sage of Omaha" is Buffett, not Sage).
# Only names and counts come from the letters; their text is never stored.
# Only companies that still exist on their own, plus "former" companies the managers
# discussed as investments (see the end of the file). Names that only appear as case
# studies (Enron, Wachovia, Slack, Sun Microsystems...) stay out.


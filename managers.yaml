    firm: BrightGate Capital
    style: "Dos fondos: Global Income, de renta fija flexible, y Focus Fund, de bolsa concentrada."
    why: "BrightGate escribe cartas semestrales largas sobre crédito y renta fija, algo poco común entre los gestores value en español."
